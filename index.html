<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Neon Overlay</title>

<style>

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent !important;
}


/* =====================================================
   NEON WEBCAM
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 125px;
    left: 40px;

    width: 430px;
    height: 250px;

    border: 4px solid #ffae4a;

    border-radius: 0;

    background: transparent !important;

    box-shadow:
        0 0 25px rgba(255, 174, 74, 1),
        0 0 55px rgba(255, 174, 74, 0.85),
        0 0 110px rgba(255, 174, 74, 0.65),
        0 0 160px rgba(255, 174, 74, 0.45);

    box-sizing: border-box;
}


/* =====================================================
   NEON PANEL ABOVE WEBCAM
===================================================== */

.webcam-panel {

    position: absolute;

    bottom: 389px;
    left: 40px;

    width: 430px;
    height: 140px;

    border: 4px solid #ffae4a;

    border-radius: 0;

    background: transparent !important;

    box-shadow:
        0 0 25px rgba(255, 174, 74, 1),
        0 0 55px rgba(255, 174, 74, 0.85),
        0 0 110px rgba(255, 174, 74, 0.65),
        0 0 160px rgba(255, 174, 74, 0.45);

    box-sizing: border-box;
}

</style>

</head>

<body>

<div class="webcam-panel"></div>

<div class="webcam-frame"></div>

</body>

</html>
