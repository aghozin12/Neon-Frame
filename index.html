
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FX LEVEL Green Glow Frame</title>

<style>

html,
body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
    font-family: Arial, sans-serif;
}

:root {
    --green: #00ff88;
    --green-bright: #baffdf;
    --green-soft: rgba(0,255,136,.55);
    --green-deep: rgba(0,210,110,.28);
}


/* =====================================================
   COPY TRADE TOP PANEL
===================================================== */

.copy-trade-panel {

    position: absolute;

    left: 40px;
    bottom: 549px;

    width: 430px;
    height: 105px;

    border: 4px solid var(--green);

    border-radius: 0;

    box-sizing: border-box;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,255,136,.045) 0%,
            rgba(0,255,136,.018) 45%,
            transparent 78%
        );

    box-shadow:

        0 0 2px #ffffff,
        0 0 5px var(--green),
        0 0 12px rgba(0,255,136,.80),
        0 0 24px rgba(0,255,136,.48),
        0 0 45px rgba(0,210,110,.28),
        inset 0 0 12px rgba(0,255,136,.18),
        inset 0 0 30px rgba(0,255,136,.08);

    display: flex;
    align-items: center;
    justify-content: center;

    animation: greenBreath 6s ease-in-out infinite;

}


/* INNER GLOW */

.copy-trade-panel::before {

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(0,255,136,.42);

    box-sizing: border-box;

    box-shadow:

        inset 0 0 10px rgba(0,255,136,.20),
        inset 0 0 28px rgba(0,255,136,.08);

    pointer-events: none;

}


/* MOVING LIGHT */

.copy-trade-panel::after {

    content: "";

    position: absolute;

    top: -4px;
    left: -4px;

    width: 115px;
    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.45),
            #ffffff 50%,
            rgba(0,255,136,.90),
            transparent
        );

    box-shadow:

        0 0 4px #ffffff,
        0 0 9px var(--green),
        0 0 20px rgba(0,255,136,.65);

    animation: scanTop 7s ease-in-out infinite;

    pointer-events: none;

}


/* TEXT */

.copy-trade-text {

    position: relative;

    z-index: 2;

    color: #ffffff;

    font-size: 22px;

    font-weight: 700;

    letter-spacing: 1px;

    text-align: center;

    white-space: nowrap;

    text-shadow:

        0 0 3px #ffffff,
        0 0 8px var(--green),
        0 0 18px rgba(0,255,136,.75);

}


/* =====================================================
   WEBCAM FRAME
   POSITION + SIZE UNCHANGED
===================================================== */

.webcam-frame {

    position: absolute;

    left: 40px;
    bottom: 125px;

    width: 430px;
    height: 250px;

    border: 4px solid var(--green);

    border-radius: 0;

    box-sizing: border-box;

    background:

        radial-gradient(
            ellipse at center,
            rgba(0,255,136,.045) 0%,
            rgba(0,255,136,.018) 45%,
            transparent 78%
        );

    box-shadow:

        0 0 2px #ffffff,
        0 0 5px var(--green),
        0 0 12px rgba(0,255,136,.80),
        0 0 24px rgba(0,255,136,.48),
        0 0 45px rgba(0,210,110,.28),
        inset 0 0 12px rgba(0,255,136,.18),
        inset 0 0 30px rgba(0,255,136,.08);

}


/* =====================================================
   INNER FRAME GLOW
===================================================== */

.webcam-frame::before {

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(0,255,136,.42);

    box-sizing: border-box;

    box-shadow:

        inset 0 0 10px rgba(0,255,136,.20),
        inset 0 0 28px rgba(0,255,136,.08);

    pointer-events: none;

}


/* =====================================================
   MOVING GREEN LIGHT
===================================================== */

.webcam-frame::after {

    content: "";

    position: absolute;

    top: -4px;
    left: -4px;

    width: 105px;
    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.45),
            #ffffff 50%,
            rgba(0,255,136,.90),
            transparent
        );

    box-shadow:

        0 0 4px #ffffff,
        0 0 9px var(--green),
        0 0 20px rgba(0,255,136,.65);

    animation: scanGreen 7s ease-in-out infinite;

    pointer-events: none;

}


/* =====================================================
   UPPER PANEL
   POSITION + SIZE UNCHANGED
===================================================== */

.webcam-panel {

    position: absolute;

    left: 40px;
    bottom: 389px;

    width: 430px;
    height: 140px;

    border: 4px solid var(--green);

    border-radius: 0;

    box-sizing: border-box;

    background:

        radial-gradient(
            ellipse at center,
            rgba(0,255,136,.045) 0%,
            rgba(0,255,136,.018) 45%,
            transparent 78%
        );

    box-shadow:

        0 0 2px #ffffff,
        0 0 5px var(--green),
        0 0 12px rgba(0,255,136,.80),
        0 0 24px rgba(0,255,136,.48),
        0 0 45px rgba(0,210,110,.28),
        inset 0 0 12px rgba(0,255,136,.18),
        inset 0 0 30px rgba(0,255,136,.08);

}


/* =====================================================
   PANEL INNER GREEN GLOW
===================================================== */

.webcam-panel::before {

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(0,255,136,.42);

    box-sizing: border-box;

    box-shadow:

        inset 0 0 10px rgba(0,255,136,.20),
        inset 0 0 28px rgba(0,255,136,.08);

    pointer-events: none;

}


/* =====================================================
   PANEL MOVING LIGHT
===================================================== */

.webcam-panel::after {

    content: "";

    position: absolute;

    top: -4px;
    right: -4px;

    width: 115px;
    height: 4px;

    background:

        linear-gradient(
            270deg,
            transparent,
            rgba(0,255,136,.45),
            #ffffff 50%,
            rgba(0,255,136,.90),
            transparent
        );

    box-shadow:

        0 0 4px #ffffff,
        0 0 9px var(--green),
        0 0 20px rgba(0,255,136,.65);

    animation: scanGreenReverse 7s ease-in-out infinite;

    pointer-events: none;

}


/* =====================================================
   SEPARATOR
   POSITION + SIZE UNCHANGED
===================================================== */

.separator {

    position: absolute;

    left: 40px;

    top: 693px;

    width: 438px;

    height: 2px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.25) 18%,
            rgba(0,255,136,.70) 38%,
            #ffffff 50%,
            rgba(0,255,136,.70) 62%,
            rgba(0,255,136,.25) 82%,
            transparent
        );

    box-shadow:

        0 0 3px #ffffff,
        0 0 8px var(--green),
        0 0 18px rgba(0,255,136,.55);

}


/* =====================================================
   CENTER ENERGY
===================================================== */

.separator::before {

    content: "";

    position: absolute;

    left: 50%;
    top: -1px;

    transform: translateX(-50%);

    width: 90px;
    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.65),
            #ffffff 50%,
            rgba(0,255,136,.65),
            transparent
        );

    box-shadow:

        0 0 4px #ffffff,
        0 0 10px var(--green),
        0 0 22px rgba(0,255,136,.65);

}


/* =====================================================
   TECH CUTS
===================================================== */

.separator::after {

    content: "";

    position: absolute;

    left: 50%;
    top: -1px;

    transform: translateX(-50%);

    width: 210px;
    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent 0%,
            transparent 17%,
            rgba(0,255,136,.38) 17%,
            rgba(0,255,136,.38) 18.5%,
            transparent 18.5%,
            transparent 81.5%,
            rgba(0,255,136,.38) 81.5%,
            rgba(0,255,136,.38) 83%,
            transparent 83%
        );

}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes scanGreen {

    0% {
        transform: translateX(0);
        opacity: .18;
    }

    10% {
        opacity: .90;
    }

    25% {
        transform: translateX(325px);
        opacity: .95;
    }

    31% {
        opacity: .12;
    }

    100% {
        transform: translateX(325px);
        opacity: .12;
    }

}


@keyframes scanGreenReverse {

    0% {
        transform: translateX(0);
        opacity: .18;
    }

    10% {
        opacity: .90;
    }

    25% {
        transform: translateX(-325px);
        opacity: .95;
    }

    31% {
        opacity: .12;
    }

    100% {
        transform: translateX(-325px);
        opacity: .12;
    }

}


@keyframes scanTop {

    0% {
        transform: translateX(0);
        opacity: .18;
    }

    10% {
        opacity: .90;
    }

    25% {
        transform: translateX(325px);
        opacity: .95;
    }

    31% {
        opacity: .12;
    }

    100% {
        transform: translateX(325px);
        opacity: .12;
    }

}


/* =====================================================
   SOFT BREATH
===================================================== */

.webcam-frame,
.webcam-panel,
.copy-trade-panel {

    animation: greenBreath 6s ease-in-out infinite;

}


@keyframes greenBreath {

    0%,
    100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.04);
    }

}


/* =====================================================
   TRANSPARENCY
===================================================== */

html,
body,
.webcam-frame,
.webcam-panel,
.copy-trade-panel {

    background-color: transparent !important;

}

</style>

</head>


<body>

<!-- COPY TRADE PANEL -->
<div class="copy-trade-panel">
    <div class="copy-trade-text" id="copyTradeBalance"></div>
</div>

<div class="webcam-panel"></div>

<div class="separator"></div>

<div class="webcam-frame"></div>


<script>

/* =====================================================
   COPY TRADE BALANCE
   فقط این عدد را تغییر بده
===================================================== */

const copyTradeBalance = 10000;


/* نمایش موجودی */

document.getElementById("copyTradeBalance").textContent =
    "TOTAL BALANCE COPY TRADE: $" +
    copyTradeBalance.toLocaleString("en-US");

</script>

</body>
</html>
```
