<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Deep Blue Premium Frame</title>

<style>

/* =====================================================
   BASE
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent !important;

    font-family: Arial, sans-serif;
}


/* =====================================================
   DEEP ELECTRIC BLUE SYSTEM
===================================================== */

:root {

    --blue-deep: #0877ff;
    --blue-main: #009dff;
    --cyan: #18e5ff;

    --blue-bright: #a8f4ff;
    --white-core: #f2ffff;

    --blue-glow: rgba(0,145,255,.72);
    --blue-soft: rgba(0,120,255,.38);
    --blue-deep-glow: rgba(0,70,255,.22);

}


/* =====================================================
   WEBCAM FRAME
   POSITION + SIZE UNCHANGED
===================================================== */

.webcam-frame {

    position: absolute;

    left: 40px;
    bottom: 125px;

    width: 430px;
    height: 250px;

    border: 4px solid var(--blue-main);

    border-radius: 0;

    box-sizing: border-box;

    background: transparent !important;

    box-shadow:

        /* precise white-blue core */
        0 0 2px rgba(242,255,255,1),

        /* electric edge */
        0 0 6px rgba(24,229,255,.95),

        /* blue optical glow */
        0 0 13px rgba(0,157,255,.72),

        /* deeper blue bloom */
        0 0 25px rgba(0,119,255,.42),

        /* atmospheric blue */
        0 0 48px rgba(0,70,255,.18);

}


/* =====================================================
   INNER BLUE HUD LINE
===================================================== */

.webcam-frame::before {

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(122,235,255,.28);

    box-sizing: border-box;

    pointer-events: none;

}


/* =====================================================
   MOVING LIGHT
===================================================== */

.webcam-frame::after {

    content: "";

    position: absolute;

    top: -4px;
    left: -4px;

    width: 105px;
    height: 4px;

    background:

        linear-gradient(
            90deg,

            transparent 0%,

            rgba(0,157,255,.10) 15%,

            rgba(24,229,255,.65) 35%,

            #f2ffff 50%,

            rgba(24,229,255,.95) 65%,

            rgba(0,119,255,.18) 85%,

            transparent 100%
        );

    box-shadow:

        0 0 3px rgba(242,255,255,1),

        0 0 8px rgba(24,229,255,.95),

        0 0 18px rgba(0,119,255,.55),

        0 0 30px rgba(0,70,255,.22);

    pointer-events: none;

    animation: scanTop 7s ease-in-out infinite;

}


/* =====================================================
   UPPER PANEL
   POSITION + SIZE UNCHANGED
===================================================== */

.webcam-panel {

    position: absolute;

    left: 40px;
    bottom: 389px;

    width: 430px;
    height: 140px;

    border: 4px solid var(--blue-main);

    border-radius: 0;

    box-sizing: border-box;

    background: transparent !important;

    box-shadow:

        0 0 2px rgba(242,255,255,1),

        0 0 6px rgba(24,229,255,.95),

        0 0 13px rgba(0,157,255,.72),

        0 0 25px rgba(0,119,255,.42),

        0 0 48px rgba(0,70,255,.18);

}


/* =====================================================
   PANEL INNER HUD LINE
===================================================== */

.webcam-panel::before {

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(122,235,255,.28);

    box-sizing: border-box;

    pointer-events: none;

}


/* =====================================================
   PANEL MOVING LIGHT
===================================================== */

.webcam-panel::after {

    content: "";

    position: absolute;

    top: -4px;
    right: -4px;

    width: 115px;
    height: 4px;

    background:

        linear-gradient(
            270deg,

            transparent 0%,

            rgba(0,157,255,.10) 15%,

            rgba(24,229,255,.65) 35%,

            #f2ffff 50%,

            rgba(24,229,255,.95) 65%,

            rgba(0,119,255,.18) 85%,

            transparent 100%
        );

    box-shadow:

        0 0 3px rgba(242,255,255,1),

        0 0 8px rgba(24,229,255,.95),

        0 0 18px rgba(0,119,255,.55),

        0 0 30px rgba(0,70,255,.22);

    pointer-events: none;

    animation: scanTopReverse 7s ease-in-out infinite;

}


/* =====================================================
   PROFESSIONAL SEPARATOR
   POSITION + SIZE UNCHANGED
===================================================== */

.separator {

    position: absolute;

    left: 40px;

    top: 693px;

    width: 438px;

    height: 2px;

    background:

        linear-gradient(
            90deg,

            transparent 0%,

            rgba(0,119,255,.08) 7%,

            rgba(0,157,255,.35) 20%,

            rgba(24,229,255,.75) 37%,

            rgba(242,255,255,1) 50%,

            rgba(24,229,255,.75) 63%,

            rgba(0,157,255,.35) 80%,

            rgba(0,119,255,.08) 93%,

            transparent 100%
        );

    box-shadow:

        0 0 2px rgba(242,255,255,1),

        0 0 6px rgba(24,229,255,.85),

        0 0 14px rgba(0,119,255,.42),

        0 0 25px rgba(0,70,255,.18);

    pointer-events: none;

}


/* =====================================================
   SEPARATOR CENTER ENERGY CORE
===================================================== */

.separator::before {

    content: "";

    position: absolute;

    left: 50%;

    top: -1px;

    transform: translateX(-50%);

    width: 82px;

    height: 4px;

    background:

        linear-gradient(
            90deg,

            transparent,

            rgba(0,157,255,.55) 18%,

            rgba(24,229,255,.90) 35%,

            #ffffff 50%,

            rgba(24,229,255,.90) 65%,

            rgba(0,157,255,.55) 82%,

            transparent
        );

    box-shadow:

        0 0 3px #ffffff,

        0 0 8px rgba(24,229,255,.95),

        0 0 18px rgba(0,119,255,.55),

        0 0 30px rgba(0,70,255,.25);

}


/* =====================================================
   SEPARATOR TECH CUTS
===================================================== */

.separator::after {

    content: "";

    position: absolute;

    left: 50%;

    top: -1px;

    transform: translateX(-50%);

    width: 210px;

    height: 4px;

    background:

        linear-gradient(
            90deg,

            transparent 0%,

            transparent 17%,

            rgba(0,157,255,.42) 17%,

            rgba(24,229,255,.42) 18.5%,

            transparent 18.5%,

            transparent 81.5%,

            rgba(24,229,255,.42) 81.5%,

            rgba(0,157,255,.42) 83%,

            transparent 83%,

            transparent 100%
        );

    pointer-events: none;

}


/* =====================================================
   SUBTLE MOVING LIGHT
===================================================== */

@keyframes scanTop {

    0% {

        transform: translateX(0);

        opacity: .20;

    }

    10% {

        opacity: .85;

    }

    25% {

        transform: translateX(325px);

        opacity: .95;

    }

    31% {

        opacity: .12;

    }

    100% {

        transform: translateX(325px);

        opacity: .12;

    }

}


@keyframes scanTopReverse {

    0% {

        transform: translateX(0);

        opacity: .20;

    }

    10% {

        opacity: .85;

    }

    25% {

        transform: translateX(-325px);

        opacity: .95;

    }

    31% {

        opacity: .12;

    }

    100% {

        transform: translateX(-325px);

        opacity: .12;

    }

}


/* =====================================================
   VERY SUBTLE BLUE BREATH
===================================================== */

.webcam-frame,
.webcam-panel {

    animation: blueBreath 6s ease-in-out infinite;

}


@keyframes blueBreath {

    0%,
    100% {

        filter: brightness(1);

    }

    50% {

        filter: brightness(1.045);

    }

}


/* =====================================================
   SEPARATOR BREATH
===================================================== */

.separator {

    animation: separatorBreath 6s ease-in-out infinite;

}


@keyframes separatorBreath {

    0%,
    100% {

        opacity: .72;

    }

    50% {

        opacity: 1;

    }

}


/* =====================================================
   TRANSPARENCY
===================================================== */

html,
body,
.webcam-frame,
.webcam-panel {

    background-color: transparent !important;

}

</style>

</head>


<body>

     UPPER PANEL

<!-- =====================================================
     WEBCAM FRAME
===================================================== -->

</body>

</html>
