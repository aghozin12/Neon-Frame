<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Premium Neon Frame</title>

<style>

/* =====================================================
   BASE
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent !important;

    font-family: Arial, sans-serif;
}


/* =====================================================
   PREMIUM COLOR SYSTEM
===================================================== */

:root {

    --gold-core: #ffd18a;
    --gold-main: #ffae4a;
    --gold-soft: rgba(255,174,74,.42);
    --gold-faint: rgba(255,174,74,.14);

    --white-core: rgba(255,248,232,.95);
    --white-soft: rgba(255,235,205,.55);

}


/* =====================================================
   WEBCAM NEON FRAME
   GEOMETRY UNCHANGED
===================================================== */

.webcam-frame {

    position: absolute;

    left: 40px;
    bottom: 125px;

    width: 430px;
    height: 250px;

    border: 4px solid var(--gold-main);

    border-radius: 0;

    background: transparent;

    box-sizing: border-box;

    /*
       Premium optical system

       Very sharp core
       Controlled bloom
       No oversized neon halo
    */

    box-shadow:

        0 0 0 1px rgba(255,174,74,.20),

        0 0 4px rgba(255,174,74,.90),

        0 0 10px rgba(255,174,74,.55),

        0 0 22px rgba(255,174,74,.25),

        0 0 42px rgba(255,174,74,.10);

}


/* =====================================================
   INNER PRECISION LINE
===================================================== */

.webcam-frame::before {

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(255,230,195,.16);

    box-sizing: border-box;

    pointer-events: none;

}


/* =====================================================
   PREMIUM CORNER GRAPHIC
===================================================== */

.webcam-frame::after {

    content: "";

    position: absolute;

    top: -4px;
    left: -4px;

    width: 110px;
    height: 4px;

    background:

        linear-gradient(
            90deg,
            #fff6df 0%,
            #ffd18a 22%,
            #ffae4a 55%,
            rgba(255,174,74,.35) 82%,
            transparent 100%
        );

    box-shadow:

        0 0 3px rgba(255,248,232,.95),
        0 0 8px rgba(255,174,74,.60),
        0 0 16px rgba(255,174,74,.22);

    pointer-events: none;

}


/* =====================================================
   WEBCAM SECONDARY CORNER ACCENT
===================================================== */

.webcam-frame {

    --corner-size: 58px;

}


/*
   Additional visual accents using
   multiple backgrounds on the border area
*/

.webcam-frame {

    background:

        linear-gradient(
            90deg,
            rgba(255,174,74,.18),
            transparent 24%
        ) top left / 130px 1px no-repeat,

        linear-gradient(

        ) top left / 1px 90px no-repeat,

        linear-gradient(
            270deg,
            rgba(255,174,74,.12),

        ) bottom right / 120px 1px no-repeat,

        linear-gradient(
            0deg,
            rgba(255,174,74,.10),
            transparent 25%
        ) bottom right / 1px 70px no-repeat;

}


/* =====================================================
   UPPER PANEL
   GEOMETRY UNCHANGED
===================================================== */

.webcam-panel {

    position: absolute;

    left: 40px;
    bottom: 389px;

    width: 430px;
    height: 140px;

    border: 4px solid var(--gold-main);

    border-radius: 0;

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(255,230,195,.16);

    box-sizing: border-box;

    pointer-events: none;

}


/* =====================================================
   UPPER PANEL PREMIUM CORNER
===================================================== */

.webcam-panel::after {

    content: "";

    position: absolute;

    top: -4px;
    right: -4px;

    width: 118px;
    height: 4px;

    background:

        linear-gradient(
            270deg,
            #fff6df 0%,
            #ffd18a 22%,
            #ffae4a 55%,
            rgba(255,174,74,.35) 82%,

        );

    box-shadow:

        0 0 3px rgba(255,248,232,.95),

        0 0 16px rgba(255,174,74,.22);

    pointer-events: none;

}


/* =====================================================
   PANEL GRAPHIC DETAIL

.webcam-panel {

    background:

        linear-gradient(
            270deg,
            rgba(255,174,74,.16),

        ) top right / 135px 1px no-repeat,

        linear-gradient(

            90deg,

}


/* =====================================================
   MICRO TECH MARKS
===================================================== */

.webcam-panel {

    --tech-line:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,174,74,.18),
            transparent
        );

}


/* =====================================================
   PROFESSIONAL 6PX SEPARATOR
   GEOMETRY UNCHANGED
===================================================== */

.separator {

    position: absolute;

    left: 40px;

    top: 693px;

    width: 438px;

    height: 2px;

    background:

        linear-gradient(
            90deg,

            transparent 0%,

            rgba(255,174,74,.08) 8%,

            rgba(255,174,74,.28) 22%,

            rgba(255,214,155,.80) 42%,

            rgba(255,248,225,1) 50%,

        );

    box-shadow:

        0 0 2px rgba(255,248,225,.95),

        0 0 5px rgba(255,174,74,.58),

        0 0 12px rgba(255,174,74,.22);

    pointer-events: none;

}


/* =====================================================
   SEPARATOR CENTER ENERGY CORE
===================================================== */

.separator::before {

    content: "";

    position: absolute;

    left: 50%;

    top: -1px;

    transform: translateX(-50%);

    width: 76px;

    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,174,74,.60) 18%,
            #fff4d8 50%,
            rgba(255,174,74,.60) 82%,

        );

   SEPARATOR TECH CUTS
===================================================== */

.separator::after {

    content: "";

    position: absolute;

    left: 50%;

    top: -1px;

    transform: translateX(-50%);

    width: 210px;

    height: 4px;

    background:

        linear-gradient(
            90deg,

            transparent 0%,
            transparent 17%,

            rgba(255,174,74,.32) 17%,
            rgba(255,174,74,.32) 18.5%,

            transparent 18.5%,
            transparent 81.5%,

            rgba(255,174,74,.32) 81.5%,
            rgba(255,174,74,.32) 83%,

            transparent 83%,
            transparent 100%
        );

    pointer-events: none;

}


/* =====================================================
   SMALL TECH POINTS
===================================================== */

.webcam-frame,
.webcam-panel {

    isolation: isolate;

}


/* =====================================================
   PREMIUM AMBIENT ANIMATION
   Extremely subtle
===================================================== */

.webcam-frame,
.webcam-panel {

    animation: premiumBreath 6s ease-in-out infinite;

}


@keyframes premiumBreath {

    0%,
    100% {

        filter:
            brightness(1);

    }

    50% {

        filter:
            brightness(1.035);

    }

}


/* =====================================================
   SEPARATOR ANIMATION
===================================================== */

.separator {

    animation: separatorPulse 6s ease-in-out infinite;

}


@keyframes separatorPulse {

    0%,
    100% {

        opacity: .78;

    }

    50% {

        opacity: 1;

    }

}


/* =====================================================
   TRANSPARENCY GUARANTEE
===================================================== */

html,
body,
.webcam-frame,
.webcam-panel {

    background-color: transparent !important;

}

</style>

</head>
