<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FX LEVEL Green Glow Frame</title>

<style>

html,
body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
    font-family: Arial, sans-serif;
}

:root {
    --green: #00ff88;
    --green-bright: #baffdf;
    --green-soft: rgba(0,255,136,.55);
    --green-deep: rgba(0,210,110,.28);
    --orange: #ff9a3c;
}

/* =====================================================
   SMALL COPY TRADING PANEL (NEW)
===================================================== */

.copytrading-mini {
    position: absolute;
    left: 40px;
    bottom: 389px;
    transform: translateY(-75px); /* دقیقاً بالای پنل اصلی */

    width: 430px;
    height: 55px; /* کوچک، جمع‌وجور */

    border: 3px solid var(--orange);
    box-sizing: border-box;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,154,60,.10) 0%,
            rgba(255,154,60,.04) 45%,
            transparent 78%
        );

    box-shadow:
        0 0 2px #ffffff,
        0 0 6px var(--orange),
        0 0 14px rgba(255,154,60,.85),
        0 0 26px rgba(255,154,60,.55),
        inset 0 0 10px rgba(255,154,60,.20);
}

.copytrading-mini span {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    color: var(--orange);
    font-family: "Orbitron", "Trebuchet MS", "Segoe UI", sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;

    text-shadow:
        0 0 3px #ffffff,
        0 0 8px rgba(255,154,60,.9),
        0 0 18px rgba(255,154,60,.7);
}


/* =====================================================
   WEBCAM FRAME
===================================================== */

.webcam-frame {
    position: absolute;
    left: 40px;
    bottom: 125px;
    width: 430px;
    height: 250px;
    border: 4px solid var(--green);
    border-radius: 0;
    box-sizing: border-box;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,255,136,.045) 0%,
            rgba(0,255,136,.018) 45%,
            transparent 78%
        );

    box-shadow:
        0 0 2px #ffffff,
        0 0 5px var(--green),
        0 0 12px rgba(0,255,136,.80),
        0 0 24px rgba(0,255,136,.48),
        0 0 45px rgba(0,210,110,.28),
        inset 0 0 12px rgba(0,255,136,.18),
        inset 0 0 30px rgba(0,255,136,.08);
}

.webcam-frame::before {
    content: "";
    position: absolute;
    top: 5px;
    left: 5px;
    width: calc(100% - 10px);
    height: calc(100% - 10px);
    border: 1px solid rgba(0,255,136,.42);
    box-sizing: border-box;

    box-shadow:
        inset 0 0 10px rgba(0,255,136,.20),
        inset 0 0 28px rgba(0,255,136,.08);
}

.webcam-frame::after {
    content: "";
    position: absolute;
    top: -4px;
    left: -4px;
    width: 105px;
    height: 4px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.45),
            #ffffff 50%,
            rgba(0,255,136,.90),
            transparent
        );

    box-shadow:
        0 0 4px #ffffff,
        0 0 9px var(--green),
        0 0 20px rgba(0,255,136,.65);

    animation: scanGreen 7s ease-in-out infinite;
}


/* =====================================================
   UPPER PANEL
===================================================== */

.webcam-panel {
    position: absolute;
    left: 40px;
    bottom: 389px;
    width: 430px;
    height: 140px;
    border: 4px solid var(--green);
    border-radius: 0;
    box-sizing: border-box;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,255,136,.045) 0%,
            rgba(0,255,136,.018) 45%,
            transparent 78%
        );

    box-shadow:
        0 0 2px #ffffff,
        0 0 5px var(--green),
        0 0 12px rgba(0,255,136,.80),
        0 0 24px rgba(0,255,136,.48),
        0 0 45px rgba(0,210,110,.28),
        inset 0 0 12px rgba(0,255,136,.18),
        inset 0 0 30px rgba(0,255,136,.08);
    }

.webcam-panel::before {
    content: "";
    position: absolute;
    top: 5px;
    left: 5px;
    width: calc(100% - 10px);
    height: calc(100% - 10px);
    border: 1px solid rgba(0,255,136,.42);
    box-sizing: border-box;

    box-shadow:
        inset 0 0 10px rgba(0,255,136,.20),
        inset 0 0 28px rgba(0,255,136,.08);
}

.webcam-panel::after {
    content: "";
    position: absolute;
    top: -4px;
    right: -4px;
    width: 115px;
    height: 4px;

    background:
        linear-gradient(
            270deg,
            transparent,
            rgba(0,255,136,.45),
            #ffffff 50%,
            rgba(0,255,136,.90),
            transparent
        );

    box-shadow:
        0 0 4px #ffffff,
        0 0 9px var(--green),
        0 0 20px rgba(0,255,136,.65);

    animation: scanGreenReverse 7s ease-in-out infinite;
}


/* =====================================================
   SEPARATOR
===================================================== */

.separator {
    position: absolute;
    left: 40px;
    top: 693px;
    width: 438px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.25) 18%,
            rgba(0,255,136,.70) 38%,
            #ffffff 50%,
            rgba(0,255,136,.70) 62%,
            rgba(0,255,136,.25) 82%,
            transparent
        );

    box-shadow:
        0 0 3px #ffffff,
        0 0 8px var(--green),
        0 0 18px rgba(0,255,136,.55);
}

.separator::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -1px;
    transform: translateX(-50%);
    width: 90px;
    height: 4px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.65),
            #ffffff 50%,
            rgba(0,255,136,.65),
            transparent
        );

    box-shadow:
        0 0 4px #ffffff,
        0 0 10px var(--green),
        0 0 22px rgba(0,255,136,.65);
}

.separator::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -1px;
    transform: translateX(-50%);
    width: 210px;
    height: 4px;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            transparent 17%,
            rgba(0,255,136,.38) 17%,
            rgba(0,255,136,.38) 18.5%,
            transparent 18.5%,
            transparent 81.5%,
            rgba(0,255,136,.38) 81.5%,
            rgba(0,255,136,.38) 83%,
            transparent 83%
        );
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes scanGreen {
    0% { transform: translateX(0); opacity: .18; }
    10% { opacity: .90; }
    25% { transform: translateX(325px); opacity: .95; }
    31% { opacity: .12; }
    100% { transform: translateX(325px); opacity: .12; }
}

@keyframes scanGreenReverse {
    0% { transform: translateX(0); opacity: .18; }
    10% { opacity: .90; }
    25% { transform: translateX(-325px); opacity: .95; }
    31% { opacity: .12; }
    100% { transform: translateX(-325px); opacity: .12; }
}

.webcam-frame,
.webcam-panel {
    animation: greenBreath 6s ease-in-out infinite;
}

@keyframes greenBreath {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.04); }
}

html,
body,
.webcam-frame,
.webcam-panel {
    background-color: transparent !important;
}

</style>

</head>

<body>

<div class="copytrading-mini">
    <span>COPY TRADING</span>
</div>

<div class="webcam-panel"></div>
<div class="separator"></div>
<div class="webcam-frame"></div>

</body>
</html>
