
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Cyan Premium Frame</title>

<style>

/* =====================================================
   BASE
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent !important;

    font-family: Arial, sans-serif;
}


/* =====================================================
   PREMIUM CYAN / BLUE COLOR SYSTEM
===================================================== */

:root {

    --cyan: #19e6ff;
    --cyan-bright: #b9f8ff;
    --cyan-soft: rgba(25,230,255,.42);
    --cyan-faint: rgba(25,230,255,.12);

    --blue: #1688ff;
    --white: #eaffff;

}


/* =====================================================
   WEBCAM FRAME
   POSITION + SIZE EXACTLY UNCHANGED
===================================================== */

.webcam-frame {

    position: absolute;

    left: 40px;
    bottom: 125px;

    width: 430px;
    height: 250px;

    border: 4px solid var(--cyan);

    border-radius: 0;

    box-sizing: border-box;

    background: transparent !important;

    box-shadow:

        0 0 2px rgba(185,248,255,.95),

        0 0 6px rgba(25,230,255,.85),

        0 0 14px rgba(25,230,255,.45),

        0 0 28px rgba(22,136,255,.22),

        0 0 48px rgba(22,136,255,.10);

}


/* =====================================================
   INNER HUD LINE
===================================================== */

.webcam-frame::before {

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(185,248,255,.18);

    box-sizing: border-box;

    pointer-events: none;

}


/* =====================================================
   MOVING LIGHT
   SUBTLE ATTENTION EFFECT
===================================================== */

.webcam-frame::after {

    content: "";

    position: absolute;

    top: -4px;
    left: -4px;

    width: 105px;
    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(185,248,255,.95) 35%,
            #ffffff 50%,
            rgba(25,230,255,.85) 68%,
            transparent
        );

    box-shadow:

        0 0 4px rgba(234,255,255,1),
        0 0 10px rgba(25,230,255,.85),
        0 0 20px rgba(25,230,255,.38);

    pointer-events: none;

    animation: scanTop 7s ease-in-out infinite;

}


/* =====================================================
   UPPER PANEL
   POSITION + SIZE EXACTLY UNCHANGED
===================================================== */

.webcam-panel {

    position: absolute;

    left: 40px;
    bottom: 389px;

    width: 430px;
    height: 140px;

    border: 4px solid var(--cyan);

    border-radius: 0;

    box-sizing: border-box;

    background: transparent !important;

    box-shadow:

        0 0 2px rgba(185,248,255,.95),

        0 0 6px rgba(25,230,255,.85),

        0 0 14px rgba(25,230,255,.45),

        0 0 28px rgba(22,136,255,.22),

        0 0 48px rgba(22,136,255,.10);

}


/* =====================================================
   PANEL INNER HUD LINE
===================================================== */

.webcam-panel::before {

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(185,248,255,.18);

    box-sizing: border-box;

    pointer-events: none;

}


/* =====================================================
   PANEL MOVING LIGHT
===================================================== */

.webcam-panel::after {

    content: "";

    position: absolute;

    top: -4px;
    right: -4px;

    width: 115px;
    height: 4px;

    background:

        linear-gradient(
            270deg,
            transparent,
            rgba(185,248,255,.95) 35%,
            #ffffff 50%,
            rgba(25,230,255,.85) 68%,
            transparent
        );

    box-shadow:

        0 0 4px rgba(234,255,255,1),
        0 0 10px rgba(25,230,255,.85),
        0 0 20px rgba(25,230,255,.38);

    pointer-events: none;

    animation: scanTopReverse 7s ease-in-out infinite;

}


/* =====================================================
   PREMIUM 6PX SEPARATOR
   POSITION EXACTLY UNCHANGED
===================================================== */

.separator {

    position: absolute;

    left: 40px;

    top: 693px;

    width: 438px;

    height: 2px;

    background:

        linear-gradient(
            90deg,

            transparent 0%,

            rgba(25,230,255,.06) 8%,

            rgba(25,230,255,.25) 22%,

            rgba(25,230,255,.65) 40%,

            rgba(234,255,255,1) 50%,

            rgba(25,230,255,.65) 60%,

            rgba(25,230,255,.25) 78%,

            rgba(25,230,255,.06) 92%,

            transparent 100%
        );

    box-shadow:

        0 0 2px rgba(234,255,255,1),

        0 0 6px rgba(25,230,255,.70),

        0 0 14px rgba(22,136,255,.25);

    pointer-events: none;

}


/* =====================================================
   SEPARATOR ENERGY CORE
===================================================== */

.separator::before {

    content: "";

    position: absolute;

    left: 50%;

    top: -1px;

    transform: translateX(-50%);

    width: 82px;

    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(25,230,255,.55) 18%,
            #ffffff 50%,
            rgba(25,230,255,.55) 82%,
            transparent
        );

    box-shadow:

        0 0 3px #ffffff,

        0 0 8px rgba(25,230,255,.90),

        0 0 17px rgba(22,136,255,.35);

}


/* =====================================================
   SEPARATOR TECH CUTS
===================================================== */

.separator::after {

    content: "";

    position: absolute;

    left: 50%;

    top: -1px;

    transform: translateX(-50%);

    width: 210px;

    height: 4px;

    background:

        linear-gradient(
            90deg,

            transparent 0%,
            transparent 17%,

            rgba(25,230,255,.30) 17%,
            rgba(25,230,255,.30) 18.5%,

            transparent 18.5%,
            transparent 81.5%,

            rgba(25,230,255,.30) 81.5%,
            rgba(25,230,255,.30) 83%,

            transparent 83%,
            transparent 100%
        );

    pointer-events: none;

}


/* =====================================================
   SUBTLE LIGHT MOTION
===================================================== */

@keyframes scanTop {

    0% {

        transform: translateX(0);

        opacity: .35;

    }

    12% {

        opacity: .85;

    }

    25% {

        transform: translateX(325px);

        opacity: .95;

    }

    30% {

        opacity: .20;

    }

    100% {

        transform: translateX(325px);

        opacity: .20;

    }

}


@keyframes scanTopReverse {

    0% {

        transform: translateX(0);

        opacity: .35;

    }

    12% {

        opacity: .85;

    }

    25% {

        transform: translateX(-325px);

        opacity: .95;

    }

    30% {

        opacity: .20;

    }

    100% {

        transform: translateX(-325px);

        opacity: .20;

    }

}


/* =====================================================
   VERY SUBTLE FRAME BREATH
===================================================== */

.webcam-frame,
.webcam-panel {

    animation: frameBreath 6s ease-in-out infinite;

}


@keyframes frameBreath {

    0%,
    100% {

        filter: brightness(1);

    }

    50% {

        filter: brightness(1.035);

    }

}


/* =====================================================
   SEPARATOR BREATH
===================================================== */

.separator {

    animation: separatorBreath 6s ease-in-out infinite;

}


@keyframes separatorBreath {

    0%,
    100% {

        opacity: .72;

    }

    50% {

        opacity: 1;

    }

}


/* =====================================================
   TRANSPARENCY GUARANTEE
===================================================== */

html,
body,
.webcam-frame,
.webcam-panel {

    background-color: transparent !important;

}

</style>

</head>


<body>


<!-- =====================================================
     UPPER PANEL
===================================================== -->

<div class="webcam-panel"></div>


<!-- =====================================================
     6PX PROFESSIONAL SEPARATOR
===================================================== -->

<div class="separator"></div>


<!-- =====================================================
     WEBCAM FRAME
===================================================== -->

<div class="webcam-frame"></div>


</body>

</html>
```
