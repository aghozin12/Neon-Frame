<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FX LEVEL Green Glow Frame</title>

<style>

html,
body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
    font-family: Arial, sans-serif;
}

:root {
    --green: #00ff88;
    --orange: #ff6600;
    --orange-bright: #ff9a3c;
}


/* =====================================================
   COPY TRADE BALANCE PANEL
   SMALL / COMPACT
===================================================== */

.copy-trade-panel {

    position: absolute;

    left: 40px;
    bottom: 539px;

    width: 430px;
    height: 55px;

    border: 3px solid var(--green);

    border-radius: 0;

    box-sizing: border-box;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,255,136,.035) 0%,
            rgba(0,255,136,.012) 50%,
            transparent 80%
        );

    box-shadow:

        0 0 2px #ffffff,
        0 0 5px var(--green),
        0 0 10px rgba(0,255,136,.70),
        0 0 20px rgba(0,255,136,.35),
        inset 0 0 10px rgba(0,255,136,.14);

    display: flex;

    align-items: center;

    justify-content: center;

    animation: greenBreath 6s ease-in-out infinite;

}


/* =====================================================
   COPY TRADE INNER LINE
===================================================== */

.copy-trade-panel::before {

    content: "";

    position: absolute;

    top: 4px;
    left: 4px;

    width: calc(100% - 8px);
    height: calc(100% - 8px);

    border: 1px solid rgba(0,255,136,.35);

    box-sizing: border-box;

    box-shadow:

        inset 0 0 8px rgba(0,255,136,.15),
        inset 0 0 18px rgba(0,255,136,.06);

    pointer-events: none;

}


/* =====================================================
   COPY TRADE MOVING LIGHT
===================================================== */

.copy-trade-panel::after {

    content: "";

    position: absolute;

    top: -3px;
    left: -3px;

    width: 90px;
    height: 3px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.45),
            #ffffff 50%,
            rgba(0,255,136,.90),
            transparent
        );

    box-shadow:

        0 0 3px #ffffff,
        0 0 7px var(--green),
        0 0 15px rgba(0,255,136,.60);

    animation: scanTop 7s ease-in-out infinite;

    pointer-events: none;

}


/* =====================================================
   COPY TRADE TEXT
===================================================== */

.copy-trade-text {

    position: relative;

    z-index: 2;

    color: var(--orange);

    font-size: 16px;

    font-weight: 700;

    letter-spacing: .7px;

    text-align: center;

    white-space: nowrap;

    text-shadow:

        0 0 2px #ffb066,
        0 0 6px var(--orange),
        0 0 12px rgba(255,102,0,.85);

}


/* =====================================================
   WEBCAM FRAME
   POSITION + SIZE UNCHANGED
===================================================== */

.webcam-frame {

    position: absolute;

    left: 40px;
    bottom: 125px;

    width: 430px;
    height: 250px;

    border: 4px solid var(--green);

    border-radius: 0;

    box-sizing: border-box;

    background:

        radial-gradient(
            ellipse at center,
            rgba(0,255,136,.045) 0%,
            rgba(0,255,136,.018) 45%,
            transparent 78%
        );

    box-shadow:

        0 0 2px #ffffff,
        0 0 5px var(--green),
        0 0 12px rgba(0,255,136,.80),
        0 0 24px rgba(0,255,136,.48),
        0 0 45px rgba(0,210,110,.28),
        inset 0 0 12px rgba(0,255,136,.18),
        inset 0 0 30px rgba(0,255,136,.08);

}


/* =====================================================
   INNER FRAME GLOW
===================================================== */

.webcam-frame::before {

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(0,255,136,.42);

    box-sizing: border-box;

    box-shadow:

        inset 0 0 10px rgba(0,255,136,.20),
        inset 0 0 28px rgba(0,255,136,.08);

    pointer-events: none;

}


/* =====================================================
   MOVING GREEN LIGHT
===================================================== */

.webcam-frame::after {

    content: "";

    position: absolute;

    top: -4px;
    left: -4px;

    width: 105px;
    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.45),
            #ffffff 50%,
            rgba(0,255,136,.90),
            transparent
        );

    box-shadow:

        0 0 4px #ffffff,
        0 0 9px var(--green),
        0 0 20px rgba(0,255,136,.65);

    animation: scanGreen 7s ease-in-out infinite;

    pointer-events: none;

}


/* =====================================================
   UPPER PANEL
   POSITION + SIZE UNCHANGED
===================================================== */

.webcam-panel {

    position: absolute;

    left: 40px;
    bottom: 389px;

    width: 430px;
    height: 140px;

    border: 4px solid var(--green);

    border-radius: 0;

    box-sizing: border-box;

    background:

        radial-gradient(
            ellipse at center,
            rgba(0,255,136,.045) 0%,
            rgba(0,255,136,.018) 45%,
            transparent 78%
        );

    box-shadow:

        0 0 2px #ffffff,
        0 0 5px var(--green),
        0 0 12px rgba(0,255,136,.80),
        0 0 24px rgba(0,255,136,.48),
        0 0 45px rgba(0,210,110,.28),
        inset 0 0 12px rgba(0,255,136,.18),
        inset 0 0 30px rgba(0,255,136,.08);

}


/* =====================================================
   PANEL INNER GREEN GLOW
===================================================== */

.webcam-panel::before {

    content: "";

    position: absolute;

    top: 5px;
    left: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 10px);

    border: 1px solid rgba(0,255,136,.42);

    box-sizing: border-box;

    box-shadow:

        inset 0 0 10px rgba(0,255,136,.20),
        inset 0 0 28px rgba(0,255,136,.08);

    pointer-events: none;

}


/* =====================================================
   PANEL MOVING LIGHT
===================================================== */

.webcam-panel::after {

    content: "";

    position: absolute;

    top: -4px;
    right: -4px;

    width: 115px;
    height: 4px;

    background:

        linear-gradient(
            270deg,
            transparent,
            rgba(0,255,136,.45),
            #ffffff 50%,
            rgba(0,255,136,.90),
            transparent
        );

    box-shadow:

        0 0 4px #ffffff,
        0 0 9px var(--green),
        0 0 20px rgba(0,255,136,.65);

    animation: scanGreenReverse 7s ease-in-out infinite;

    pointer-events: none;

}


/* =====================================================
   SEPARATOR
   POSITION + SIZE UNCHANGED
===================================================== */

.separator {

    position: absolute;

    left: 40px;

    top: 693px;

    width: 438px;

    height: 2px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.25) 18%,
            rgba(0,255,136,.70) 38%,
            #ffffff 50%,
            rgba(0,255,136,.70) 62%,
            rgba(0,255,136,.25) 82%,
            transparent
        );

    box-shadow:

        0 0 3px #ffffff,
        0 0 8px var(--green),
        0 0 18px rgba(0,255,136,.55);

}


/* =====================================================
   CENTER ENERGY
===================================================== */

.separator::before {

    content: "";

    position: absolute;

    left: 50%;
    top: -1px;

    transform: translateX(-50%);

    width: 90px;
    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.65),
            #ffffff 50%,
            rgba(0,255,136,.65),
            transparent
        );

    box-shadow:

        0 0 4px #ffffff,
        0 0 10px var(--green),
        0 0 22px rgba(0,255,136,.65);

}


/* =====================================================
   TECH CUTS
===================================================== */

.separator::after {

    content: "";

    position: absolute;

    left: 50%;
    top: -1px;

    transform: translateX(-50%);

    width: 210px;
    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent 0%,
            transparent 17%,
            rgba(0,255,136,.38) 17%,
            rgba(0,255,136,.38) 18.5%,
            transparent 18.5%,
            transparent 81.5%,
            rgba(0,255,136,.38) 81.5%,
            rgba(0,255,136,.38) 83%,
            transparent 83%
        );

}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes scanGreen {

    0% {
        transform: translateX(0);
        opacity: .18;
    }

    10% {
        opacity: .90;
    }

    25% {
        transform: translateX(325px);
        opacity: .95;
    }

    31% {
        opacity: .12;
    }

    100% {
        transform: translateX(325px);
        opacity: .12;
    }

}


@keyframes scanGreenReverse {

    0% {
        transform: translateX(0);
        opacity: .18;
    }

    10% {
        opacity: .90;
    }

    25% {
        transform: translateX(-325px);
        opacity: .95;
    }

    31% {
        opacity: .12;
    }

    100% {
        transform: translateX(-325px);
        opacity: .12;
    }

}


@keyframes scanTop {

    0% {
        transform: translateX(0);
        opacity: .18;
    }

    10% {
        opacity: .90;
    }

    25% {
        transform: translateX(325px);
        opacity: .95;
    }

    31% {
        opacity: .12;
    }

    100% {
        transform: translateX(325px);
        opacity: .12;
    }

}


/* =====================================================
   SOFT BREATH
===================================================== */

.webcam-frame,
.webcam-panel,
.copy-trade-panel {

    animation: greenBreath 6s ease-in-out infinite;

}


@keyframes greenBreath {

    0%,
    100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.04);
    }

}


/* =====================================================
   TRANSPARENCY
===================================================== */

html,
body,
.webcam-frame,
.webcam-panel,
.copy-trade-panel {

    background-color: transparent !important;

}

</style>

</head>


<body>

<!-- =====================================================
     COPY TRADE BALANCE
===================================================== -->

<div class="copy-trade-panel">

    <div
        class="copy-trade-text"
        id="copyTradeBalance">
    </div>

</div>


<!-- =====================================================
     EXISTING PANELS
===================================================== -->

<div class="webcam-panel"></div>

<div class="separator"></div>

<div class="webcam-frame"></div>


<script>

/* =====================================================
   COPY TRADE BALANCE

   اگر موجودی نمی‌خواهی:
   null

   اگر موجودی می‌خواهی:
   مثلا 1250
===================================================== */

const copyTradeBalance = null;


/* =====================================================
   DISPLAY BALANCE

   پنل همیشه باقی می‌ماند.
   فقط متن موجودی در صورت نبودن مقدار مخفی می‌شود.
===================================================== */

const balanceText =
    document.getElementById("copyTradeBalance");


if (
    copyTradeBalance === null ||
    copyTradeBalance === undefined ||
    copyTradeBalance === ""
) {

    balanceText.textContent = "";

} else {

    balanceText.textContent =
        "TOTAL BALANCE COPY TRADE: $" +
        Number(copyTradeBalance).toLocaleString("en-US");

}

</script>

</body>
</html>
```
