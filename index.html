<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Neon Overlay</title>

<style>

/* =====================================================
   BASE
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent !important;

}


/* =====================================================
   COMMON NEON FRAME
===================================================== */

.neon-frame {

    position: absolute;

    border: 4px solid #ffae4a;

    border-radius: 0;

    background: transparent !important;

    /*
       اصلی‌ترین نور
    */
    box-shadow:

        0 0 4px rgba(255, 255, 255, 1),

        0 0 9px rgba(255, 174, 74, 1),

        0 0 18px rgba(255, 174, 74, 0.95),

        0 0 35px rgba(255, 174, 74, 0.80),

        0 0 65px rgba(255, 174, 74, 0.60),

        0 0 110px rgba(255, 174, 74, 0.35);

}


/* =====================================================
   INNER NEON EDGE
===================================================== */

.neon-frame::before {

    content: "";

    position: absolute;

    top: 3px;
    left: 3px;
    right: 3px;
    bottom: 3px;

    border: 1px solid rgba(255, 235, 190, 0.95);

    pointer-events: none;

    box-shadow:

        0 0 5px rgba(255, 210, 140, 0.9),

        inset 0 0 5px rgba(255, 174, 74, 0.65);

}


/* =====================================================
   OUTER ELECTRIC HALO
===================================================== */

.neon-frame::after {

    content: "";

    position: absolute;

    top: -9px;
    left: -9px;
    right: -9px;
    bottom: -9px;

    border: 1px solid rgba(255, 174, 74, 0.28);

    pointer-events: none;

    box-shadow:

        0 0 18px rgba(255, 174, 74, 0.55),

        0 0 45px rgba(255, 174, 74, 0.32),

        0 0 90px rgba(255, 174, 74, 0.20);

}


/* =====================================================
   WEBCAM FRAME
===================================================== */

.webcam-frame {

    bottom: 125px;
    left: 40px;

    width: 430px;
    height: 250px;

}


/* =====================================================
   TOP PANEL
===================================================== */

.webcam-panel {

    bottom: 389px;
    left: 40px;

    width: 430px;
    height: 140px;

}


/* =====================================================
   CORNER LIGHT POINTS
===================================================== */

.corner {

    position: absolute;

    width: 9px;
    height: 9px;

    background: #fff4df;

    border: 2px solid #ffae4a;

    border-radius: 50%;

    z-index: 5;

    box-shadow:

        0 0 5px #ffffff,

        0 0 12px #ffae4a,

        0 0 25px #ffae4a,

        0 0 45px rgba(255, 174, 74, 0.8);

}


/* =====================================================
   CORNER POSITIONS
===================================================== */

.corner.tl {

    top: -7px;
    left: -7px;

}

.corner.tr {

    top: -7px;
    right: -7px;

}

.corner.bl {

    bottom: -7px;
    left: -7px;

}

.corner.br {

    bottom: -7px;
    right: -7px;

}


/* =====================================================
   ELECTRIC ACCENT SEGMENTS
===================================================== */

.accent {

    position: absolute;

    height: 2px;

    background: #ffe2b5;

    box-shadow:

        0 0 5px #ffffff,

        0 0 12px #ffae4a,

        0 0 25px rgba(255, 174, 74, 0.85);

    z-index: 4;

}


/* =====================================================
   ACCENT LOCATIONS
===================================================== */

.accent.a1 {

    width: 42px;

    top: -7px;
    left: 55px;

}

.accent.a2 {

    width: 25px;

    top: -7px;
    right: 70px;

}

.accent.a3 {

    width: 32px;

    bottom: -7px;
    left: 105px;

}

.accent.a4 {

    width: 48px;

    bottom: -7px;
    right: 50px;

}


/* =====================================================
   SMALL SIDE LIGHTS
===================================================== */

.side-light {

    position: absolute;

    width: 3px;
    height: 28px;

    background: #ffe6c2;

    box-shadow:

        0 0 5px #ffffff,

        0 0 12px #ffae4a,

        0 0 25px rgba(255, 174, 74, 0.8);

    z-index: 4;

}


.side-light.left {

    left: -7px;
    top: 50%;

    transform: translateY(-50%);

}


.side-light.right {

    right: -7px;
    top: 50%;

    transform: translateY(-50%);

}


/* =====================================================
   SUBTLE PULSE
===================================================== */

.neon-frame {

    animation: neonPulse 3.8s ease-in-out infinite;

}


@keyframes neonPulse {

    0%,
    100% {

        filter: brightness(1);

    }

    50% {

        filter: brightness(1.13);

    }

}


/* =====================================================
   PANEL / WEBCAM
===================================================== */

.webcam-panel,
.webcam-frame {

    isolation: isolate;

}

</style>

</head>


<body>


<!-- ===================================================
     TOP PANEL
=================================================== -->

<div class="neon-frame webcam-panel">

    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <span class="accent a1"></span>
    <span class="accent a2"></span>
    <span class="accent a3"></span>
    <span class="accent a4"></span>

    <span class="side-light left"></span>
    <span class="side-light right"></span>

</div>


<!-- ===================================================
     WEBCAM
=================================================== -->

<div class="neon-frame webcam-frame">

    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <span class="accent a1"></span>
    <span class="accent a2"></span>
    <span class="accent a3"></span>
    <span class="accent a4"></span>

    <span class="side-light left"></span>
    <span class="side-light right"></span>

</div>


</body>

</html>
